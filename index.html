<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mid State RP - Bug Reports</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="splash" id="splash">
    <img src="logo.png" class="logo">
</div>

<div class="app" id="app">
    <div class="tablet">
        <h1>Bug Report System</h1>

        <input type="text" id="user" placeholder="Your Name / Discord">

        <select id="category"></select>
        <select id="subcategory"></select>

        <textarea id="desc" placeholder="Describe the issue..."></textarea>
        <input type="text" id="steps" placeholder="Steps to reproduce (optional)">
        <input type="text" id="image" placeholder="Screenshot URL (optional)">

        <button onclick="submitReport()">Submit Report</button>
        <p id="status"></p>
    </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
